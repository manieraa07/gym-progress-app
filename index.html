<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1014">
<title>DUO LANE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1014; --s1:#171A21; --s2:#1F232C; --s3:#2A2F3A;
  --line:rgba(232,228,218,.10); --line2:rgba(232,228,218,.05);
  --chalk:#E9E5DB; --dim:#98A0AC; --faint:#646B78;
  --m:#5468FF; --m-s:rgba(84,104,255,.14);
  --a:#FF7A18; --a-s:rgba(255,122,24,.14);
  --ok:#31BE72; --pr:#F5C518; --warn:#FF9F45;
  --r:18px; --rl:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--chalk);font-family:'Instrument Sans',system-ui,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.04}
.mono{font-family:'Martian Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:3px;border-radius:8px}
.eyebrow{font-family:'Martian Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint)}
.wrap{max-width:520px;margin:0 auto;width:100%}

/* ============ HOME ============ */
#app{min-height:100%;display:flex;flex-direction:column}
.page{flex:1;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(96px + env(safe-area-inset-bottom))}
.hero{padding:22px 0 20px}
.hero h1{font-size:clamp(32px,9.5vw,42px)}
.hero h1 em{font-style:normal;display:block;color:var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.kpi{background:var(--s1);padding:12px}
.kpi b{display:block;font-family:'Martian Mono',monospace;font-size:18px;font-weight:700;letter-spacing:-.05em}
.kpi span{font-size:10.5px;color:var(--faint)}
.big-card{position:relative;display:block;width:100%;text-align:left;background:var(--s1);
  border:1px solid var(--line);border-radius:var(--rl);padding:18px;margin-bottom:13px;overflow:hidden;
  transition:transform .16s}
.big-card:active{transform:scale(.985)}
.big-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.c-duo::after{background:linear-gradient(180deg,var(--m),var(--a))}
.c-solo::after{background:var(--a)}
.big-card h2{font-size:24px;margin:8px 0 5px}
.big-card p{margin:0;font-size:13px;color:var(--dim)}
.meta{display:flex;gap:12px;align-items:center;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--line2);font-size:11.5px;color:var(--faint)}
.meta .go{margin-left:auto;font-weight:600;color:var(--chalk)}
.resume{background:linear-gradient(140deg,var(--m-s),var(--a-s));border-color:rgba(84,104,255,.3)}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--rl);padding:16px;margin-bottom:12px}
.panel h3{font-size:14px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s2);border-radius:var(--r);padding:13px}
.tile b{display:block;font-family:'Martian Mono',monospace;font-size:21px;letter-spacing:-.05em}
.tile span{font-size:10.5px;color:var(--faint)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line2)}
.lrow:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.lrow .t{font-size:13.5px}.lrow .s{font-size:11px;color:var(--faint)}
.lrow .v{margin-left:auto;font-family:'Martian Mono',monospace;font-size:12px;color:var(--dim)}
.empty{text-align:center;padding:40px 16px;color:var(--faint);font-size:13px}
.empty b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;color:var(--chalk);margin-bottom:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,16,20,.95);
  backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 18px calc(8px + env(safe-area-inset-bottom))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{padding:8px 4px;text-align:center;font-size:10px;color:var(--faint);
  font-family:'Martian Mono',monospace;letter-spacing:.1em}
.tab i{display:block;font-style:normal;font-size:17px;margin-bottom:3px;filter:grayscale(1) opacity(.5)}
.tab[aria-current="page"]{color:var(--chalk)}.tab[aria-current="page"] i{filter:none}

/* ============ FOCUS RUNNER ============ */
.run{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.run-top{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line)}
.run-top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.ibtn{width:34px;height:34px;border-radius:11px;background:var(--s2);display:grid;place-items:center;
  font-size:14px;color:var(--dim);flex:none}
.run-ttl{flex:1;min-width:0}
.run-ttl h2{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk{font-family:'Martian Mono',monospace;font-size:15px;font-weight:700;letter-spacing:-.04em;text-align:right}
.clk small{display:block;font-size:8px;letter-spacing:.14em;color:var(--faint);font-weight:400}
/* progress pips = mapa treningu */
.pips{max-width:520px;margin:10px auto 0;display:flex;gap:3px;align-items:center}
.pip{flex:1;height:4px;border-radius:2px;background:var(--s3);transition:background .3s}
.pip.done{background:var(--ok)}
.pip.now{background:var(--chalk)}
.pip.sep{flex:0 0 12px;background:none;display:grid;place-items:center;color:var(--faint);font-size:9px}

.run-body{flex:1;overflow-y:auto;padding:0 16px;display:flex;flex-direction:column;justify-content:center}
.stage{max-width:520px;margin:0 auto;width:100%;padding:18px 0}
.stage.fade{animation:sw .32s cubic-bezier(.2,.9,.2,1)}
@keyframes sw{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.who-band{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:11px;
  font-family:'Martian Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.13em}
.who-band.m{background:var(--m-s);color:var(--m)}
.who-band.a{background:var(--a-s);color:var(--a)}
.ex-name{font-size:clamp(30px,8.5vw,38px);margin:14px 0 6px}
.ex-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.chip{font-family:'Martian Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.07em;
  padding:4px 8px;border-radius:7px;background:var(--s2);color:var(--dim)}
.chip.hl{background:rgba(49,190,114,.14);color:var(--ok)}

.dials{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:22px 0 14px}
.dial{background:var(--s1);border:1px solid var(--line);border-radius:var(--rl);padding:12px 10px 10px;text-align:center}
.dial > .eyebrow{display:block;margin-bottom:4px}
.dial-val{display:flex;align-items:center;justify-content:center;gap:2px}
.dial-val input{width:100%;background:none;border:none;outline:none;color:var(--chalk);text-align:center;
  font-family:'Martian Mono',monospace;font-size:40px;font-weight:700;letter-spacing:-.07em;padding:2px 0}
.dial-val input::placeholder{color:var(--s3)}
.unit{font-family:'Martian Mono',monospace;font-size:11px;color:var(--faint);margin-top:-2px}
.dial-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.dial-btns button{height:46px;border-radius:13px;background:var(--s2);border:1px solid var(--line);
  font-size:22px;color:var(--dim);display:grid;place-items:center;touch-action:none;user-select:none}
.dial-btns button:active{background:var(--s3);color:var(--chalk)}

.ref{display:flex;gap:8px;margin-bottom:16px}
.ref button,.ref div{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:14px;
  padding:10px 11px;text-align:left}
.ref .eyebrow{display:block;margin-bottom:3px}
.ref b{font-family:'Martian Mono',monospace;font-size:13px;font-weight:700;letter-spacing:-.03em}
.ref .none{color:var(--faint);font-size:12px;font-family:'Instrument Sans',sans-serif;font-weight:400}

.coach{display:flex;gap:11px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);
  border-left:3px solid var(--warn);border-radius:14px;padding:12px 13px;margin-bottom:16px;
  animation:sw .3s ease}
.coach.up{border-left-color:var(--ok)}
.coach.pr{border-left-color:var(--pr)}
.coach-i{font-size:15px;line-height:1.2}
.coach b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
.coach span{font-size:12.5px;color:var(--dim)}

.run-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:rgba(14,16,20,.95);backdrop-filter:blur(18px)}
.run-foot-in{max-width:520px;margin:0 auto;display:flex;gap:9px;align-items:center}
.save{flex:1;height:56px;border-radius:16px;background:var(--chalk);color:#0E1014;font-weight:600;
  font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .14s}
.save:active{transform:scale(.975)}
.save.m{background:var(--m);color:#fff}
.save.a{background:var(--a);color:#1A0C02}
.skip{height:56px;padding:0 16px;border-radius:16px;background:var(--s2);border:1px solid var(--line);
  font-size:12px;font-family:'Martian Mono',monospace;color:var(--dim);letter-spacing:.06em}

/* handoff + rest overlay */
.veil{position:fixed;inset:0;z-index:60;background:rgba(10,11,14,.86);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;padding:22px;animation:fi .22s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.veil-in{max-width:400px;width:100%;text-align:center}
.hand-badge{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:16px;
  font-family:'Martian Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.12em;margin-bottom:20px}
.veil h2{font-size:clamp(28px,8vw,36px);margin-bottom:10px}
.veil p{color:var(--dim);font-size:14px;margin:0 0 26px}
.ringbox{position:relative;width:170px;height:170px;margin:0 auto 22px}
.ringbox svg{transform:rotate(-90deg)}
.ringbox b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Martian Mono',monospace;
  font-size:38px;font-weight:700;letter-spacing:-.06em}
.veil-btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.vbtn{height:52px;border-radius:15px;background:var(--s2);border:1px solid var(--line);
  font-family:'Martian Mono',monospace;font-size:11.5px;letter-spacing:.08em}
.vbtn.hero{grid-column:1/-1;background:var(--chalk);color:#0E1014;font-family:'Instrument Sans',sans-serif;
  font-size:15px;font-weight:600;letter-spacing:0}

/* fork gate */
.forkbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.fbtn{padding:18px 12px;border-radius:18px;border:1px solid var(--line);background:var(--s1);text-align:left}
.fbtn:active{transform:scale(.97)}
.fbtn.m{border-left:3px solid var(--m)}
.fbtn.a{border-left:3px solid var(--a)}
.fbtn b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:800;margin-bottom:3px}
.fbtn span{font-size:11px;color:var(--faint);line-height:1.35;display:block}

/* stats */
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.hbar .lbl{width:92px;flex:none;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .trk{flex:1;height:9px;background:var(--s2);border-radius:5px;overflow:hidden}
.hbar .trk i{display:block;height:100%;border-radius:5px}
.hbar .val{font-family:'Martian Mono',monospace;font-size:10.5px;color:var(--faint);width:56px;text-align:right}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.prow:last-child{border-bottom:none}
.prow .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{display:block;font-family:'Martian Mono',monospace;font-size:10px;color:var(--faint)}
.delta{font-family:'Martian Mono',monospace;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.delta.up{background:rgba(49,190,114,.15);color:var(--ok)}
.delta.flat{background:var(--s2);color:var(--faint)}
.delta.down{background:rgba(200,50,43,.15);color:#E8695F}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);
  font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--faint)}
.seg button[aria-pressed="true"]{color:var(--chalk)}
.seg button.m[aria-pressed="true"]{background:var(--m-s);border-color:rgba(84,104,255,.4)}
.seg button.a[aria-pressed="true"]{background:var(--a-s);border-color:rgba(255,122,24,.4)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;background:var(--chalk);
  color:#0E1014;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 14px 34px rgba(0,0,0,.55);animation:tp .24s ease;max-width:90vw;text-align:center}
@keyframes tp{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="veil"></div>

<script>
/* =====================================================================
   DUO LANE — HIT low volume, 2 osoby, 1–2 telefony
   ===================================================================== */

/* ---------- 1. PLAN ---------- */
const EX={
  latzug:          {n:'Latzug',              sub:'ściąganie z góry', grp:'Plecy',   sets:2},
  wioslowanie:     {n:'Wiosłowanie w siadzie',sub:'maszyna',         grp:'Plecy',   sets:2},
  wyciskanie_skos: {n:'Wyciskanie skos',     sub:'hantle',           grp:'Klatka',  sets:2, tech:true},
  bary:            {n:'Shoulder press',      sub:'bary',             grp:'Barki',   sets:2},
  rozpietki:       {n:'Rozpiętki',           sub:'pec-deck',         grp:'Klatka',  sets:2},
  a_legpress:      {n:'Suwnica',             sub:'Beinpresse',       grp:'Nogi',    sets:2},
  a_hamstrings:    {n:'Uginanie nóg',        sub:'dwugłowy',         grp:'Nogi',    sets:2},
  a_abductor:      {n:'Abduktor',            sub:'maszyna',          grp:'Pośladki',sets:2},
  a_calves:        {n:'Łydki',               sub:'maszyna',          grp:'Łydki',   sets:2},
  overhead_triceps:{n:'Overhead triceps',    sub:'wyciąg',           grp:'Triceps', sets:1},
  pushdown_triceps:{n:'Pushdown',            sub:'wyciąg',           grp:'Triceps', sets:1},
  biceps_maszyna:  {n:'Biceps siedzący',     sub:'maszyna',          grp:'Biceps',  sets:2},
  wznosy:          {n:'Wznosy bokiem',       sub:'maszyna',          grp:'Barki',   sets:2}
};
const P={martin:{name:'Martin',k:'m',c:'var(--m)'}, ana:{name:'Ana',k:'a',c:'var(--a)'}};
const TOGETHER_1=['latzug','wioslowanie'];
const SPLIT_M=['wyciskanie_skos','bary','rozpietki'];
const SPLIT_A=['a_legpress','a_hamstrings','a_abductor','a_calves'];
const TOGETHER_2=['overhead_triceps','pushdown_triceps','biceps_maszyna','wznosy'];
const REST=120, REST_LONG=180;

/* ---------- 2. STORE ---------- */
const DB=(()=>{
  const K='duolane.v3', KL='duolane.live';
  const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
  const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  let cache=rd(K)||{sessions:[]};
  return {
    all:()=>cache.sessions,
    save(s){cache.sessions.push(s);wr(K,cache);
      /* FIRESTORE HOOK → addDoc(collection(db,'sessions'), s) */},
    live:()=>rd(KL),
    setLive:s=>wr(KL,s),
    clearLive(){try{localStorage.removeItem(KL)}catch(e){}}
  };
})();

/* ---------- 3. Analityka ---------- */
const vol=s=>(+s.kg||0)*(+s.reps||0);
const e1=s=>(+s.kg||0)*(1+(+s.reps||0)/30);
const totalVol=(sets,p)=>sets.filter(s=>!p||s.person===p).reduce((a,s)=>a+vol(s),0);
const mine=p=>DB.all().filter(x=>x.sets.some(s=>s.person===p));
function prevSet(ex,p,n){
  for(const s of [...DB.all()].reverse()){
    const m=s.sets.find(v=>v.ex===ex&&v.person===p&&v.set===n); if(m) return m;
  } return null;
}
function best(ex,p){let b=null;DB.all().forEach(s=>s.sets.forEach(v=>{
  if(v.ex===ex&&v.person===p&&(!b||e1(v)>e1(b)))b=v;}));return b;}
function topHistory(ex,p){return DB.all().map(s=>{
  const r=s.sets.filter(v=>v.ex===ex&&v.person===p);
  return r.length?Math.max(...r.map(v=>+v.kg||0)):null;}).filter(v=>v!==null);}
const fVol=v=>v>=1000?(v/1000).toFixed(1).replace('.',',')+' t':Math.round(v)+' kg';
const fDur=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const fDate=d=>new Date(d).toLocaleDateString('pl-PL',{day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=m=>{if(navigator.vibrate)try{navigator.vibrate(m)}catch(e){}};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;
  document.body.appendChild(e);setTimeout(()=>e.remove(),2200);}

/* ---------- 4. TRENER ---------- */
/* HIT: 2 serie do RIR 0-1. Cel 6-10 powt. Skos: technika, próg 12. */
function coach(entry,rec,S){
  const ex=EX[entry.ex], r=+rec.reps;
  const hiCap = ex.tech ? 12 : 10;
  const hasNext = entry.set < ex.sets;

  // spadek siły względem poprzedniej serii tego samego ćwiczenia
  const prevInSession = S.log.find(l=>l.ex===entry.ex&&l.person===entry.person&&l.set===entry.set-1);
  if(prevInSession && (+prevInSession.reps - r) >= 3){
    S.restNext = REST_LONG;
    return {t:'warn',i:'🫁',h:'Spadek siły',
      b:`${prevInSession.reps} → ${r} powtórzeń. Weź 3 minuty przerwy zamiast dwóch.`};
  }
  if(r<6){
    S.restNext = REST_LONG;
    return {t:'warn',i:'⬇',h:'Za ciężko',
      b: hasNext ? 'Zejdź o jeden przeskok na maszynie w następnej serii i weź 3 minuty przerwy.'
                 : 'Następnym razem zacznij od jednego przeskoku niżej.'};
  }
  if(r>hiCap){
    if(ex.tech) return {t:'up',i:'⬆',h:'Dodaj 2,5 kg',
      b: hasNext ? `${r} powtórzeń na skosie — w drugiej serii idź o 2,5 kg wyżej. Technika przed ciężarem.`
                 : `${r} powtórzeń. Od następnego treningu zacznij o 2,5 kg wyżej.`};
    return {t:'up',i:'⬆',h:'Za lekko',
      b: hasNext ? `${r} powtórzeń przy RIR 0–1 to za mało oporu. Podbij o jeden przeskok w drugiej serii.`
                 : `${r} powtórzeń. Od następnego treningu wejdź jeden przeskok wyżej.`};
  }
  return null;
}

/* ---------- 5. KOLEJKA ---------- */
/* Buduje liniową listę wpisów. Na ćwiczeniach wspólnych naprzemiennie:
   M-S1, A-S1 (→ przerwa), M-S2, A-S2 (→ przerwa). */
function buildQueue(S){
  const q=[]; const both=S.solo?['ana']:['martin','ana'];
  const add=(ids,people,phase)=>{
    ids.forEach(id=>{
      for(let n=1;n<=EX[id].sets;n++){
        people.forEach((p,i)=>q.push({ex:id,person:p,set:n,phase,
          rest: i===people.length-1}));   // przerwa dopiero po ostatniej osobie
      }
    });
  };
  if(S.solo){ add(SPLIT_A,['ana'],'solo'); return q; }
  add(TOGETHER_1,both,'t1');
  q.push({gate:'fork',phase:'fork'});
  if(!S.who) return q;
  add(S.who==='martin'?SPLIT_M:SPLIT_A,[S.who],'split');
  q.push({gate:'reunite',phase:'reunite'});
  if(S.reunited===null||S.reunited===undefined) return q;
  add(TOGETHER_2, S.reunited?both:[S.who],'t2');
  return q;
}

  return out;

function readF(id){const el=document.getElementById(id);return el?el.value.replace(',','.'):'';}
function bump(which,by){
  const el=document.getElementById('f-'+which); if(!el) return;
  const q=buildQueue(S), cur=q[S.i]; const prev=prevSet(cur.ex,cur.person,cur.set);
  const base = el.value!=='' ? +el.value.replace(',','.') : (prev?+prev[which]:0);
  const v=Math.max(0,base+by);
  el.value = which==='kg' ? String(Math.round(v*10)/10) : String(Math.round(v));
  S.draft={kg:readF('f-kg'),reps:readF('f-reps')}; persist();
}
function saveSet(){
  const q=buildQueue(S), cur=q[S.i];
  const kg=+readF('f-kg'), reps=+readF('f-reps');
  if(!kg||!reps){toast('Wpisz ciężar i powtórzenia');buzz(30);return;}
  const rec={ex:cur.ex,person:cur.person,set:cur.set,kg,reps,t:Date.now()};

  const b=best(cur.ex,cur.person);
  const isPR = !b || e1(rec)>e1(b);

  S.restNext=REST;
  const tip=coach(cur,rec,S);
  S.log.push(rec); S.draft=null; S.tip=null; S.i++;
  buzz(isPR?[12,60,12]:18); persist();

  const nq=buildQueue(S), nx=nq[S.i];
  const restSec=S.restNext;

  // przekazanie maszyny — bez przerwy
  if(!cur.rest && nx && !nx.gate && nx.ex===cur.ex && nx.set===cur.set){
    render();
    handoff(nx.person, cur.person, tip, isPR);
    return;
  }
  render();
  if(nx) rest(restSec, tip, isPR, nx);
  else if(tip||isPR) showTip(tip,isPR);
}
function showTip(tip,isPR){
  if(isPR) S.tip={t:'pr',i:'★',h:'Nowy rekord',b:'To najlepszy wynik w tym ćwiczeniu.'};
  if(tip) S.tip=tip;
  persist(); render();
}

let restT=null;
function rest(sec,tip,isPR,nx){
  let left=sec, total=sec; const R=76, C=2*Math.PI*R;
  const long = sec>=REST_LONG;
  const nxt = nx&&!nx.gate ? `${P[nx.person].name} · ${EX[nx.ex].n} S${nx.set}` : 'Kolejny krok';
  veil.innerHTML=`<div class="veil"><div class="veil-in">
    <span class="hand-badge" style="background:var(--s2);color:${long?'var(--warn)':'var(--dim)'}">
      ${long?'DŁUŻSZA PRZERWA':'PRZERWA'}</span>
    <div class="ringbox"><svg width="170" height="170">
      <circle cx="85" cy="85" r="${R}" stroke="var(--s3)" stroke-width="8" fill="none"/>
      <circle id="rp" cx="85" cy="85" r="${R}" stroke="${long?'var(--warn)':'var(--ok)'}" stroke-width="8"
        fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
      <b id="rn">${fDur(sec)}</b></div>
    <h2 style="font-size:22px">Następnie</h2>
    <p style="margin-top:6px">${esc(nxt)}</p>
    ${isPR?`<div class="coach pr" style="text-align:left"><span class="coach-i">★</span>
      <div><b>Nowy rekord</b><span>Najlepszy wynik w tym ćwiczeniu.</span></div></div>`:''}
    ${tip?`<div class="coach ${tip.t}" style="text-align:left"><span class="coach-i">${tip.i}</span>
      <div><b>${esc(tip.h)}</b><span>${esc(tip.b)}</span></div></div>`:''}
    <div class="veil-btns">
      <button class="vbtn" data-rest="30">+30 S</button>
      <button class="vbtn" data-act="closeVeil">POMIŃ</button></div>
  </div></div>`;
  if(tip) S.tip=tip; persist();
  clearInterval(restT);
  restT=setInterval(()=>{
    left--; const n=document.getElementById('rn'), c=document.getElementById('rp');
    if(!n){clearInterval(restT);return;}
    n.textContent=fDur(Math.max(0,left));
    if(c) c.style.strokeDashoffset=String(C*(1-Math.max(0,left)/total));
    if(left<=0){clearInterval(restT);buzz([25,90,25]);closeVeil();}
  },1000);
  veil.__add=x=>{left+=x;total+=x;};
}
const closeVeil=()=>{clearInterval(restT);veil.innerHTML='';render();};

  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${c}"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      <div class="tile"><b>${ids.length}</b><span>ćwiczeń</span></div></div>
    <div class="panel"><h3>Objętość sesja po sesji</h3>
      ${ms.length?ms.map(s=>`<div class="hbar"><span class="lbl">${fDate(s.date)}</span>
        <span class="trk"><i style="width:${totalVol(s.sets,p)/mxV*100}%;background:${c}"></i></span>
        <span class="val">${fVol(totalVol(s.sets,p))}</span></div>`).join(''):'<div class="empty">Brak danych.</div>'}</div>
    <div class="panel"><h3>Progresja ciężaru</h3>
      ${ids.length?ids.map(id=>{const t=topHistory(id,p);
        const d=t.length>1?(t[t.length-1]-t[0])/t[0]*100:0, cl=d>1?'up':d<-1?'down':'flat';
        return `<div class="prow"><div class="nm">${esc(EX[id].n)}<small>${t[t.length-1]} kg top</small></div>
        ${spark(t,c)}<span class="delta ${cl}">${t.length>1?(d>0?'+':'')+d.toFixed(0)+'%':'—'}</span></div>`
      }).join(''):'<div class="empty">Brak danych.</div>'}</div>
    <div class="panel"><h3>Rekordy (szac. 1RM)</h3>
      ${ids.map(id=>{const b=best(id,p);return b?`<div class="lrow">
        <span class="dot" style="background:${c}"></span>
        <div><div class="t">${esc(EX[id].n)}</div><div class="s">${b.kg} kg × ${b.reps}</div></div>
        <div class="v">${e1(b).toFixed(1)} kg</div></div>`:''}).join('')}</div>
  </div>`;
}
function vLog(){
  const all=[...DB.all()].reverse();
  return `<div class="page wrap">
    <div class="hero"><span class="eyebrow">Historia</span><h1>Wszystkie sesje.</h1></div>
    ${all.length?all.map(s=>`<div class="panel">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span class="dot" style="background:${s.solo?'var(--a)':'var(--m)'}"></span>
        <div><div style="font-size:14px;font-weight:600">${s.solo?'Ana — dół':'Martin &amp; Ana'}</div>
        <div style="font-size:11px;color:var(--faint)">${new Date(s.date).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}</div></div>
        <div class="mono" style="margin-left:auto;font-size:12px;color:var(--dim)">${fDur(s.duration)}</div></div>
      ${[...new Set(s.sets.map(x=>x.ex))].map(id=>`<div class="hbar">
        <span class="lbl">${esc(EX[id].n)}</span>
        <span class="mono" style="flex:1;font-size:10px;color:var(--faint)">${
          s.sets.filter(x=>x.ex===id).map(r=>`${P[r.person].name[0]} ${r.kg}×${r.reps}`).join('  ·  ')}</span></div>`).join('')}
    </div>`).join(''):`<div class="empty"><b>Jeszcze pusto</b>Pierwszy zapisany trening pojawi się tutaj.</div>`}
  </div>`;
}

/* ---------- 14. Router ---------- */
function tabs(){
  const t=(r,i,l)=>`<button class="tab" data-go="${r}" ${view===r?'aria-current="page"':''}><i>${i}</i>${l}</button>`;
  return `<div class="tabs"><div class="tabs-in">${t('home','🏋️','TRENING')}${t('stats','📈','STATY')}${t('log','🗂','HISTORIA')}</div></div>`;
}
function render(){
  if(view==='run'){app.innerHTML=vRun();clock();return;}
  app.innerHTML=(view==='stats'?vStats():view==='log'?vLog():view==='summary'?vSummary():vHome())
    + (view==='summary'?'':tabs());
}
function clock(){
  clearInterval(window.__clk);
  window.__clk=setInterval(()=>{
    if(!S){clearInterval(window.__clk);return;}
    const el=document.getElementById('clk'); if(!el)return;
    const t=Math.floor((Date.now()-S.start)/1000);
    el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  },1000);
}

/* ---------- 15. Zdarzenia ---------- */
let hT=null,hD=null;
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-hold]'); if(!b)return;
  e.preventDefault();
  const [w,by]=b.dataset.hold.split('|'); const dir=+by;
  bump(w,dir); buzz(8); let n=0;
  hD=setTimeout(()=>{hT=setInterval(()=>{n++;bump(w, dir*(w==='kg'&&n>15?5:1));},110);},400);
},{passive:false});
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  document.addEventListener(ev,()=>{clearTimeout(hD);clearInterval(hT);hT=hD=null;}));

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-who],[data-reun],[data-stats],[data-rest]');
  if(!t)return; const d=t.dataset;
  if(d.go==='duo') return newSession(false);
  if(d.go==='solo') return newSession(true);
  if(d.go==='resume') return resume();
  if(d.go){view=d.go;render();window.scrollTo(0,0);return;}
  if(d.who){S.who=d.who;S.i++;buzz(12);persist();render();return;}
  if(d.reun!==undefined){S.reunited=d.reun==='1';S.i++;buzz(12);persist();render();return;}
  if(d.stats){statsWho=d.stats;render();return;}
  if(d.rest){veil.__add?.(+d.rest);buzz(8);return;}
  if(d.act==='save') return saveSet();
  if(d.act==='closeVeil') return closeVeil();
  if(d.act==='finish') return finish();
  if(d.act==='skip'){S.i++;S.draft=null;S.tip=null;persist();render();return;}
  if(d.act==='usePrev'){const q=buildQueue(S),c=q[S.i],p=prevSet(c.ex,c.person,c.set);
    if(p){document.getElementById('f-kg').value=p.kg;document.getElementById('f-reps').value=p.reps;
      S.draft={kg:p.kg,reps:p.reps};persist();buzz(10);} return;}
  if(d.act==='useSet1'){const q=buildQueue(S),c=q[S.i];
    const s=S.log.find(l=>l.ex===c.ex&&l.person===c.person&&l.set===c.set-1);
    if(s){document.getElementById('f-kg').value=s.kg;document.getElementById('f-reps').value=s.reps;
      S.draft={kg:s.kg,reps:s.reps};persist();buzz(10);} return;}
  if(d.act==='quit'){
    if(S.log.length){ if(confirm('Zapisać trening i wyjść?')) return finish(); }
    if(confirm('Wyjść bez zapisu?')){DB.clearLive();S=null;clearInterval(window.__clk);view='home';render();}
    return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='f-kg'||e.target.id==='f-reps'){
    S.draft={kg:readF('f-kg'),reps:readF('f-reps')};persist();}
});
window.addEventListener('beforeunload',persist);

render();
</script>
