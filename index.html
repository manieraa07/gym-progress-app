<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f19">
  <title>GymApp Pro</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <div id="mode-selection" class="card main-menu-card">
      <div class="logo-badge">GYM ENGINE</div>
      <h1>Kto dzisiaj trenuje?</h1>
      <p class="subtitle">Wybierz odpowiednią ścieżkę treningową</p>
      
      <div class="button-group">
        <button onclick="window.startSession('martin_session')" class="btn btn-martin">
          <span class="btn-icon">⚡</span>
          <div class="btn-text">
            <strong>Martin & Ana</strong>
            <small>Wspólna Góra + Dedykowane Martina</small>
          </div>
        </button>
        
        <button onclick="window.startSession('ana_solo')" class="btn btn-ana">
          <span class="btn-icon">🔥</span>
          <div class="btn-text">
            <strong>Ana Solo</strong>
            <small>Dół / Nogi i Pośladki</small>
          </div>
        </button>
      </div>
    </div>

    <div id="loading-screen" class="hidden loading-card">
      <div class="spinner"></div>
      <p>Pobieranie ostatnich wyników...</p>
    </div>

    <div id="exercise-card-view" class="hidden">
      <div class="progress-bar-container">
        <div class="progress-info">
          <span id="progress-text">Ćwiczenie 1 z 9</span>
          <span id="set-badge" class="badge-set">SERIA 1 z 2</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div id="card-container" class="swipe-wrapper"></div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
