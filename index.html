<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymApp Engine</title>
</head>
<body style="background: #030712; font-family: sans-serif; padding: 16px; margin: 0;">

  <div id="mode-selection" style="max-width: 400px; margin: 40px auto; text-align: center; color: #fff;">
    <h1 style="font-size: 20px;">Wybierz tryb treningu</h1>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
      <button onclick="window.startSession('martin_session')" style="padding: 16px; background: #2563eb; color: #fff; font-weight: bold; border: none; border-radius: 12px; cursor: pointer;">
        Martin (Wspólny Trening Góry)
      </button>
      <button onclick="window.startSession('ana_solo')" style="padding: 16px; background: #db2777; color: #fff; font-weight: bold; border: none; border-radius: 12px; cursor: pointer;">
        Ana Solo (Dół)
      </button>
    </div>
  </div>

  <div id="exercise-card-view" style="max-width: 400px; margin: 0 auto;" class="hidden">
    <div id="card-container"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
