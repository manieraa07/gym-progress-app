<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GymApp - Martin & Ana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-24 min-h-screen select-none">

  <header class="p-4 glass-card sticky top-0 z-50 border-b border-slate-800/80 flex justify-between items-center backdrop-blur-xl">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
      <div>
        <h1 class="text-lg font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
          GYM PROGRESS
        </h1>
        <p class="text-[10px] uppercase tracking-widest font-semibold text-slate-400">Martin & Ana</p>
      </div>
    </div>
    <button onclick="window.saveWorkout()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs shadow-lg shadow-emerald-500/20 active:scale-95 transition-all">
      ZAPISZ
    </button>
  </header>

  <main class="p-4 max-w-md mx-auto">
    <div id="exercises-container" class="space-y-4"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
