<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GymApp - Focus Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-10 min-h-screen select-none flex flex-col justify-between">

  <header class="p-4 glass-panel sticky top-0 z-50 border-b border-slate-800/80 flex justify-between items-center backdrop-blur-xl">
    <div class="flex items-center gap-2">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
      <h1 class="text-base font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400">
        GYM PROGRESS
      </h1>
    </div>
    <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full">
      Focus Mode
    </span>
  </header>

  <main class="p-4 max-w-md mx-auto w-full my-auto">
    <div id="card-container"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
