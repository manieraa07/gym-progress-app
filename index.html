<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090d16">
  <title>Gym Engine Pro</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-shell">
    
    <header class="top-nav">
      <button onclick="location.reload()" class="nav-btn-close">✕</button>
      <div class="nav-title">
        <span class="nav-subtitle">TRENING W TOKU</span>
        <h1 id="nav-workout-name">Góra Ciała</h1>
      </div>
      <div id="session-timer" class="timer-chip">00:00</div>
    </header>

    <main class="workout-feed" id="workout-feed">
      </main>

    <footer class="bottom-dock">
      <div class="dock-info">
        <div class="dock-progress-track">
          <div id="dock-progress-bar" class="dock-progress-fill"></div>
        </div>
        <span id="dock-status-text">Ukończono 0 z 9 ćwiczeń</span>
      </div>
      <button onclick="window.finishWorkout()" class="btn-finish-workout">
        Zakończ i Zapisz Trening
      </button>
    </footer>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
