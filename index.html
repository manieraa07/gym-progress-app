<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101216">
<title>DUO LANE — dziennik treningowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DUO LANE — design tokens
   Palette: iron graphite + chalk, two lane identities,
   bumper-plate coding for load badges.
   ============================================================ */
:root{
  --iron-900:#101216;
  --iron-800:#171a20;
  --iron-700:#1e222a;
  --iron-600:#272c36;
  --hairline:rgba(232,228,218,.10);
  --hairline-2:rgba(232,228,218,.05);

  --chalk:#E8E4DA;
  --chalk-dim:#9AA0AB;
  --chalk-faint:#666D79;

  --lane-m:#4C63FF;      /* Martin — cobalt */
  --lane-m-soft:rgba(76,99,255,.14);
  --lane-a:#FF7A18;      /* Ana — molten amber */
  --lane-a-soft:rgba(255,122,24,.14);
  --done:#2FB86B;
  --pr:#F5C518;

  /* competition bumper plates */
  --plate-red:#C8322B;
  --plate-blue:#2C56C8;
  --plate-yellow:#D9A81C;
  --plate-green:#2E8B57;

  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --dock-h:96px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--iron-900);
  color:var(--chalk);
  font-family:'Instrument Sans',system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
body::before{ /* ambient lane glow, static */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(70% 40% at 12% -5%, rgba(76,99,255,.16), transparent 70%),
    radial-gradient(60% 40% at 92% 4%, rgba(255,122,24,.12), transparent 70%);
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
.mono{font-family:'Martian Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100%;
  padding-top:env(safe-area-inset-top);display:flex;flex-direction:column}
.view{flex:1;padding:0 18px calc(var(--dock-h) + env(safe-area-inset-bottom)) 18px}

/* ---------- eyebrow / labels ---------- */
.eyebrow{font-family:'Martian Mono',monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-faint)}

/* ---------- home ---------- */
.masthead{padding:26px 0 18px}
.masthead h1{font-size:clamp(34px,10vw,44px)}
.masthead h1 em{font-style:normal;display:block;color:var(--chalk-faint)}
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hairline);
  border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;margin-bottom:22px}
.kpi{background:var(--iron-800);padding:12px 12px 13px}
.kpi b{display:block;font-family:'Martian Mono',monospace;font-size:19px;font-weight:700;letter-spacing:-.04em}
.kpi span{font-size:10.5px;color:var(--chalk-faint);letter-spacing:.02em}

.session-card{position:relative;display:block;width:100%;text-align:left;background:var(--iron-800);
  border:1px solid var(--hairline);border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:14px;
  overflow:hidden;transition:transform .18s ease,border-color .18s ease}
.session-card:active{transform:scale(.985)}
.session-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.card-duo::after{background:linear-gradient(180deg,var(--lane-m),var(--lane-a))}
.card-solo::after{background:var(--lane-a)}
.session-card h2{font-size:25px;margin:8px 0 4px}
.session-card p{margin:0;font-size:13px;color:var(--chalk-dim)}
.card-meta{display:flex;gap:14px;align-items:center;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--hairline-2);font-size:11.5px;color:var(--chalk-faint)}
.card-meta .go{margin-left:auto;font-weight:600;color:var(--chalk)}

.log-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--hairline-2)}
.log-row:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;flex:none}
.log-row .t{font-size:13.5px}
.log-row .s{font-size:11px;color:var(--chalk-faint)}
.log-row .v{margin-left:auto;font-family:'Martian Mono',monospace;font-size:12px;color:var(--chalk-dim)}

/* ---------- lane toggle (signature) ---------- */
.lane-switch{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;
  background:var(--iron-700);border:1px solid var(--hairline);border-radius:14px;padding:4px;margin:2px 0 16px}
.lane-switch .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
  border-radius:10px;background:var(--lane-m);transition:transform .28s cubic-bezier(.2,.9,.2,1),background .28s}
.lane-switch[data-lane="ana"] .thumb{transform:translateX(100%);background:var(--lane-a)}
.lane-switch button{position:relative;z-index:1;padding:9px 6px;font-family:'Martian Mono',monospace;
  font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--chalk-faint);transition:color .2s}
.lane-switch button[aria-selected="true"]{color:#0d0f13}
.lane-count{font-size:9px;opacity:.7}

/* ---------- session header ---------- */
.sess-head{position:sticky;top:0;z-index:20;background:rgba(16,18,22,.86);
  backdrop-filter:blur(18px);border-bottom:1px solid var(--hairline);
  padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;margin:0 -18px 16px}
.sess-top{display:flex;align-items:center;gap:12px}
.icon-btn{width:34px;height:34px;border-radius:11px;background:var(--iron-700);
  display:grid;place-items:center;font-size:14px;color:var(--chalk-dim);flex:none}
.sess-title{flex:1;min-width:0}
.sess-title h2{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:'Martian Mono',monospace;font-size:15px;font-weight:700;letter-spacing:-.03em}
.clock small{display:block;font-size:8.5px;letter-spacing:.14em;color:var(--chalk-faint);font-weight:400}
.bar{height:3px;background:var(--iron-600);border-radius:2px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .35s ease}

/* ---------- exercise card ---------- */
.ex{background:var(--iron-800);border:1px solid var(--hairline);border-radius:var(--r-lg);
  margin-bottom:12px;overflow:hidden;transition:opacity .2s}
.ex.done{opacity:.55}
.ex-head{display:flex;gap:13px;align-items:center;padding:14px}
.ex-idx{font-family:'Martian Mono',monospace;font-size:11px;font-weight:700;color:var(--chalk-faint);
  width:22px;flex:none;padding-top:2px}
.ex-body{flex:1;min-width:0}
.ex-body h3{font-size:15.5px;letter-spacing:-.01em}
.ex-sub{font-size:11px;color:var(--chalk-faint);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:'Martian Mono',monospace;
  font-size:9.5px;font-weight:600;letter-spacing:.06em;padding:3px 7px;border-radius:6px;
  background:var(--iron-600);color:var(--chalk-dim)}
.chip.pr{background:rgba(245,197,24,.15);color:var(--pr)}
.ex-toggle{font-size:15px;color:var(--chalk-faint);padding:6px;flex:none}

.sets{padding:0 14px 14px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.set-n{font-family:'Martian Mono',monospace;font-size:10px;color:var(--chalk-faint)}
.field{background:var(--iron-700);border:1px solid var(--hairline);border-radius:12px;
  display:flex;align-items:center;overflow:hidden;height:44px}
.field input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--chalk);
  text-align:center;font-family:'Martian Mono',monospace;font-size:15px;font-weight:700;letter-spacing:-.04em}
.field input::placeholder{color:var(--chalk-faint);font-weight:400}
.field .step{width:30px;height:100%;font-size:16px;color:var(--chalk-faint);background:var(--hairline-2)}
.field .step:active{background:var(--iron-600);color:var(--chalk)}
.set-check{width:40px;height:44px;border-radius:12px;background:var(--iron-700);
  border:1px solid var(--hairline);display:grid;place-items:center;color:var(--chalk-faint);
  font-size:15px;transition:background .16s,color .16s,transform .16s}
.set-check[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#08130c;transform:scale(1.04)}
.set-legend{display:grid;grid-template-columns:26px 1fr 1fr 40px;gap:8px;margin-bottom:7px}
.set-legend span{font-family:'Martian Mono',monospace;font-size:8.5px;letter-spacing:.12em;
  color:var(--chalk-faint);text-align:center}
.set-legend span:first-child{text-align:left}

.prev{display:flex;align-items:center;gap:6px;font-family:'Martian Mono',monospace;
  font-size:10px;color:var(--chalk-faint);margin:0 0 9px 34px}
.plate{width:4px;height:12px;border-radius:1px;background:var(--chalk-faint)}
.p-red{background:var(--plate-red)}.p-blue{background:var(--plate-blue)}
.p-yellow{background:var(--plate-yellow)}.p-green{background:var(--plate-green)}

.lane-strip{display:flex;align-items:center;gap:8px;padding:8px 14px;
  font-family:'Martian Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.14em}
.lane-strip.m{background:var(--lane-m-soft);color:var(--lane-m)}
.lane-strip.a{background:var(--lane-a-soft);color:var(--lane-a)}

.note{width:100%;background:var(--iron-700);border:1px solid var(--hairline);border-radius:12px;
  padding:10px 12px;color:var(--chalk);font-size:13px;outline:none;margin-top:2px}

/* split marker */
.split{position:relative;margin:22px 4px 18px;padding:16px 16px 16px 18px;border-radius:var(--r-md);
  border:1px dashed rgba(255,122,24,.4);background:rgba(255,122,24,.06)}
.split h3{font-size:15px;color:var(--lane-a)}
.split p{margin:6px 0 0;font-size:12.5px;color:var(--chalk-dim)}
.split button{margin-top:12px;background:var(--lane-a);color:#180c02;font-weight:600;
  padding:11px 16px;border-radius:12px;font-size:13px;width:100%}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(16,18,22,.94);
  backdrop-filter:blur(20px);border-top:1px solid var(--hairline);
  padding:11px 18px calc(11px + env(safe-area-inset-bottom))}
.dock-inner{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock-stat{flex:1;min-width:0}
.dock-stat b{font-family:'Martian Mono',monospace;font-size:13px;letter-spacing:-.03em;display:block}
.dock-stat span{font-size:10.5px;color:var(--chalk-faint)}
.btn-primary{background:var(--chalk);color:#101216;font-weight:600;padding:13px 20px;
  border-radius:13px;font-size:13.5px;white-space:nowrap}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--iron-700);border:1px solid var(--hairline);color:var(--chalk);
  padding:13px 18px;border-radius:13px;font-size:13.5px;font-weight:500}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(16,18,22,.94);
  backdrop-filter:blur(20px);border-top:1px solid var(--hairline);
  padding:8px 18px calc(8px + env(safe-area-inset-bottom))}
.tabbar-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{padding:8px 4px;text-align:center;font-size:10.5px;color:var(--chalk-faint);
  font-family:'Martian Mono',monospace;letter-spacing:.08em}
.tab i{display:block;font-style:normal;font-size:17px;margin-bottom:3px;filter:grayscale(1) opacity(.55)}
.tab[aria-current="page"]{color:var(--chalk)}
.tab[aria-current="page"] i{filter:none}

/* ---------- rest sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,9,11,.72);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--iron-800);
  border:1px solid var(--hairline);border-bottom:none;border-radius:26px 26px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom));animation:rise .3s cubic-bezier(.2,.9,.2,1)}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rest-wrap{display:flex;align-items:center;gap:18px}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Martian Mono',monospace;
  font-size:22px;font-weight:700;letter-spacing:-.05em}
.rest-actions{display:flex;gap:8px;margin-top:16px}
.rest-actions button{flex:1;background:var(--iron-700);border:1px solid var(--hairline);
  padding:12px;border-radius:12px;font-family:'Martian Mono',monospace;font-size:11.5px}

/* ---------- summary & stats ---------- */
.panel{background:var(--iron-800);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.panel h3{font-size:14px;margin-bottom:12px}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-big{background:var(--iron-700);border-radius:var(--r-md);padding:13px}
.stat-big b{display:block;font-family:'Martian Mono',monospace;font-size:22px;letter-spacing:-.05em}
.stat-big span{font-size:10.5px;color:var(--chalk-faint)}

.hbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px}
.hbar .lbl{width:96px;flex:none;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.hbar .track{flex:1;height:9px;background:var(--iron-700);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:5px;transition:width .5s ease}
.hbar .val{font-family:'Martian Mono',monospace;font-size:10.5px;color:var(--chalk-faint);width:52px;text-align:right}

.prog-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hairline-2)}
.prog-row:last-child{border-bottom:none}
.prog-row .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-row .nm small{display:block;font-family:'Martian Mono',monospace;font-size:10px;color:var(--chalk-faint)}
.delta{font-family:'Martian Mono',monospace;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px}
.delta.up{background:rgba(47,184,107,.15);color:var(--done)}
.delta.flat{background:var(--iron-700);color:var(--chalk-faint)}
.delta.down{background:rgba(200,50,43,.15);color:#E8695F}

.empty{text-align:center;padding:44px 20px;color:var(--chalk-faint);font-size:13px}
.empty b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;color:var(--chalk);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 20px);transform:translateX(-50%);
  z-index:60;background:var(--chalk);color:#101216;padding:11px 18px;border-radius:12px;
  font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<div id="overlay"></div>

<script>
/* ==========================================================================
   1. PLAN
   ========================================================================== */
const PLAN = {
  duo: {
    label:'Martin & Ana — góra',
    lanes:['martin','ana'],
    items:[
      {id:'latzug',            n:'Latzug',                  m:'ściąganie z góry',      grp:'Plecy',    sets:2, reps:'8–10', who:['martin','ana']},
      {id:'wioslowanie',       n:'Wiosłowanie w siadzie',   m:'maszyna',               grp:'Plecy',    sets:2, reps:'7–9',  who:['martin','ana']},
      {id:'wyciskanie_skos',   n:'Wyciskanie skos',         m:'hantle',                grp:'Klatka',   sets:2, reps:'8–10', who:['martin']},
      {id:'bary',              n:'Shoulder press',          m:'bary',                  grp:'Barki',    sets:2, reps:'7–9',  who:['martin']},
      {id:'rozpietki',         n:'Rozpiętki',               m:'pec-deck',              grp:'Klatka',   sets:2, reps:'8–12', who:['martin']},
      {id:'overhead_triceps',  n:'Overhead triceps',        m:'wyciąg',                grp:'Triceps',  sets:1, reps:'8–10', who:['martin','ana']},
      {id:'pushdown_triceps',  n:'Pushdown',                m:'wyciąg',                grp:'Triceps',  sets:1, reps:'10–12',who:['martin','ana']},
      {id:'biceps_maszyna',    n:'Biceps siedzący',         m:'maszyna',               grp:'Biceps',   sets:2, reps:'9–12', who:['martin','ana']},
      {id:'wznosy',            n:'Wznosy bokiem',           m:'maszyna',               grp:'Barki',    sets:2, reps:'8–12', who:['martin','ana']}
    ],
    // po tym ćwiczeniu Ana odchodzi na swoje 4 ćwiczenia
    splitAfter:'wioslowanie'
  },
  solo: {
    label:'Ana — dół',
    lanes:['ana'],
    items:[
      {id:'a_legpress',  n:'Suwnica',            m:'Beinpresse',   grp:'Nogi',      sets:2, reps:'8–10', who:['ana']},
      {id:'a_hamstrings',n:'Uginanie nóg',       m:'dwugłowy',     grp:'Nogi',      sets:2, reps:'10–12',who:['ana']},
      {id:'a_abductor',  n:'Abduktor',           m:'maszyna',      grp:'Pośladki',  sets:2, reps:'12–15',who:['ana']},
      {id:'a_calves',    n:'Łydki',              m:'maszyna',      grp:'Łydki',     sets:2, reps:'12–15',who:['ana']}
    ]
  }
};
const ALL_EX = {};
[...PLAN.duo.items, ...PLAN.solo.items].forEach(e=>ALL_EX[e.id]=e);
const PERSON = {
  martin:{name:'Martin', color:'var(--lane-m)', key:'m'},
  ana:{name:'Ana', color:'var(--lane-a)', key:'a'}
};

/* ==========================================================================
   2. STORE  —  punkt podłączenia Firestore
   Podmień save()/load() na addDoc/getDocs i reszta aplikacji działa bez zmian.
   ========================================================================== */
const Store = (()=> {
  const KEY='duolane.v1';
  let mem=null;
  function read(){
    if(mem) return mem;
    try{ const raw=localStorage.getItem(KEY); if(raw) mem=JSON.parse(raw); }catch(e){}
    if(!mem) mem={sessions:seed()};
    return mem;
  }
  function write(){
    try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){ /* sandbox / private mode → pamięć */ }
    // FIRESTORE HOOK:
    // addDoc(collection(db,'sessions'), mem.sessions[mem.sessions.length-1]);
  }
  return {
    sessions:()=>read().sessions,
    add(session){ read().sessions.push(session); write(); },
    reset(){ mem={sessions:[]}; write(); }
  };

  /* historia startowa zbudowana z Waszych notatek — 5 tygodni progresji */
  function seed(){
    const base={
      latzug:{martin:[54,8],ana:[50,11]}, wioslowanie:{martin:[54,7],ana:[50,7]},
      wyciskanie_skos:{martin:[5,8]}, bary:{martin:[14,8]}, rozpietki:{martin:[36,8]},
      overhead_triceps:{martin:[10,7],ana:[12,10]}, pushdown_triceps:{martin:[12,11],ana:[17,6]},
      biceps_maszyna:{martin:[32,9],ana:[18,10]}, wznosy:{martin:[36,8],ana:[36,8]},
      a_legpress:{ana:[72,8]}, a_hamstrings:{ana:[27,10]}, a_abductor:{ana:[45,12]}, a_calves:{ana:[20,12]}
    };
    const out=[]; const day=86400000;
    for(let w=5;w>=1;w--){
      const type = (w%2===0)?'solo':'duo';
      const t = Date.now() - w*7*day;
      const sets=[];
      PLAN[type].items.forEach(ex=>{
        ex.who.forEach(p=>{
          const b=base[ex.id] && base[ex.id][p]; if(!b) return;
          for(let s=1;s<=ex.sets;s++){
            const grow = (5-w)*0.9;                    // lekka progresja w czasie
            sets.push({ex:ex.id,person:p,set:s,
              kg:Math.round((b[0]+grow)*2)/2,
              reps:Math.max(4, b[1] - (s-1))});
          }
        });
      });
      out.push({id:'seed'+w,type,date:new Date(t).toISOString(),duration:52*60+w*40,sets,seed:true});
    }
    return out;
  }
})();

/* ==========================================================================
   3. Analityka
   ========================================================================== */
const volOf = s => (Number(s.kg)||0)*(Number(s.reps)||0);
const e1rm  = s => (Number(s.kg)||0)*(1+(Number(s.reps)||0)/30);

function sessionsOf(person){
  return Store.sessions().filter(x=>x.sets.some(s=>s.person===person));
}
function volume(sets, person){
  return sets.filter(s=>!person||s.person===person).reduce((a,s)=>a+volOf(s),0);
}
function bestSet(exId, person, exclude){
  let best=null;
  Store.sessions().forEach(x=>{ if(exclude && x.id===exclude) return;
    x.sets.forEach(s=>{ if(s.ex===exId&&s.person===person&&(!best||e1rm(s)>e1rm(best))) best=s; });
  });
  return best;
}
function lastSet(exId, person, setNo){
  const s=[...Store.sessions()].reverse();
  for(const x of s){
    const m=x.sets.find(v=>v.ex===exId&&v.person===person&&v.set===setNo);
    if(m) return m;
  }
  return null;
}
function history(exId, person){
  return Store.sessions().map(x=>{
    const rel=x.sets.filter(s=>s.ex===exId&&s.person===person);
    if(!rel.length) return null;
    return {date:x.date, top:Math.max(...rel.map(r=>Number(r.kg)||0)), vol:rel.reduce((a,r)=>a+volOf(r),0)};
  }).filter(Boolean);
}
function streakWeeks(){
  const weeks=new Set(Store.sessions().map(s=>{
    const d=new Date(s.date); const on=new Date(d.getFullYear(),0,1);
    return d.getFullYear()+'-'+Math.floor((d-on)/604800000);
  }));
  let n=0; const now=new Date();
  for(let i=0;i<52;i++){
    const d=new Date(now.getTime()-i*604800000); const on=new Date(d.getFullYear(),0,1);
    const k=d.getFullYear()+'-'+Math.floor((d-on)/604800000);
    if(weeks.has(k)) n++; else if(i>0) break;
  }
  return n;
}
const fmtVol = v => v>=1000 ? (v/1000).toFixed(1).replace('.',',')+' t' : Math.round(v)+' kg';
const fmtDur = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const fmtDate = d => new Date(d).toLocaleDateString('pl-PL',{day:'numeric',month:'short'});
function plateClass(kg){ kg=Number(kg)||0; return kg>=50?'p-red':kg>=30?'p-blue':kg>=20?'p-yellow':'p-green'; }
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function startSession(type){
  S={ id:'s'+Date.now(), type, date:new Date().toISOString(), start:Date.now(),
      lane: type==='duo' ? 'martin' : 'ana', sets:{}, notes:{}, collapsed:{}, prs:{} };
  go('session');
  tickClock();
}
function laneItems(){
  return PLAN[S.type].items.filter(e=>e.who.includes(S.lane));
}
function activePlanItems(){
  // dla Any w sesji duo: jej wspólne ćwiczenia + jej blok nóg
  if(S.type==='duo' && S.lane==='ana'){
    return [...PLAN.duo.items.filter(e=>e.who.includes('ana')), ...PLAN.solo.items];
  }
  return laneItems();
}
function setKey(ex,p,n){ return ex+'|'+p+'|'+n; }
function totalSetsFor(){
  return activePlanItems().reduce((a,e)=>a+e.sets,0);
}
function doneCount(){
  const items=activePlanItems();
  return Object.keys(S.sets).filter(k=>{
    const [ex,p]=k.split('|'); return p===S.lane && items.some(e=>e.id===ex) && S.sets[k].done;
  }).length;
}

function exerciseCard(ex,i,p){
  const rows=[];
  const allDone=Array.from({length:ex.sets},(_,k)=>S.sets[setKey(ex.id,p,k+1)]?.done).every(Boolean);
  const best=bestSet(ex.id,p);
  const collapsed=S.collapsed[ex.id+p];

  for(let n=1;n<=ex.sets;n++){
    const k=setKey(ex.id,p,n);
    const cur=S.sets[k]||{};
    const prev=lastSet(ex.id,p,n);
    rows.push(`
      ${prev?`<div class="prev"><span class="plate ${plateClass(prev.kg)}"></span>ostatnio ${prev.kg} kg × ${prev.reps}</div>`:''}
      <div class="set">
        <span class="set-n">S${n}</span>
        <div class="field">
          <button class="step" data-nudge="${k}|kg|-2.5" aria-label="mniej kg">−</button>
          <input inputmode="decimal" data-inp="${k}|kg" value="${cur.kg??''}" placeholder="${prev?prev.kg:'kg'}" aria-label="kg seria ${n}">
          <button class="step" data-nudge="${k}|kg|2.5" aria-label="więcej kg">+</button>
        </div>
        <div class="field">
          <button class="step" data-nudge="${k}|reps|-1" aria-label="mniej powtórzeń">−</button>
          <input inputmode="numeric" data-inp="${k}|reps" value="${cur.reps??''}" placeholder="${prev?prev.reps:'powt'}" aria-label="powtórzenia seria ${n}">
          <button class="step" data-nudge="${k}|reps|1" aria-label="więcej powtórzeń">+</button>
        </div>
        <button class="set-check" data-check="${k}" aria-pressed="${!!cur.done}" aria-label="Zatwierdź serię ${n}">✓</button>
      </div>`);
  }

  return `
  <div class="ex ${allDone?'done':''}">
    <div class="lane-strip ${PERSON[p].key}">${esc(PERSON[p].name.toUpperCase())} · ${esc(ex.grp.toUpperCase())}</div>
    <div class="ex-head">
      <span class="ex-idx">${String(i+1).padStart(2,'0')}</span>
      <div class="ex-body">
        <h3>${esc(ex.n)}</h3>
        <div class="ex-sub">
          <span class="chip">${esc(ex.m)}</span>
          <span class="chip">${ex.sets}×${esc(ex.reps)}</span>
          ${best?`<span class="chip">REKORD ${best.kg}×${best.reps}</span>`:''}
          ${S.prs[ex.id+p]?`<span class="chip pr">★ NOWY REKORD</span>`:''}
        </div>
      </div>
      <button class="ex-toggle" data-collapse="${ex.id+p}" aria-label="Zwiń">${collapsed?'▾':'▴'}</button>
    </div>
    ${collapsed?'':`<div class="sets">
      <div class="set-legend"><span></span><span>CIĘŻAR</span><span>POWT.</span><span></span></div>
      ${rows.join('')}
      <input class="note" data-note="${ex.id+p}" value="${esc(S.notes[ex.id+p]||'')}" placeholder="Notatka: ustawienie siedziska, odczucia…">
    </div>`}
  </div>`;
}

/* ---- interakcje sesji ---- */
function readField(k,which){
  const el=document.querySelector(`[data-inp="${k}|${which}"]`);
  return el?el.value.replace(',','.'):'';
}
function ensure(k){
  if(!S.sets[k]){ const [ex,person,n]=k.split('|'); S.sets[k]={ex,person,set:Number(n)}; }
  return S.sets[k];
}
function nudge(k,which,by){
  const el=document.querySelector(`[data-inp="${k}|${which}"]`);
  const prev=lastSet(...(()=>{const[a,b,c]=k.split('|');return[a,b,Number(c)]})());
  const base = el.value!=='' ? Number(el.value.replace(',','.')) : (prev? Number(prev[which]) : 0);
  const v=Math.max(0, base+by);
  el.value= which==='kg' ? String(Math.round(v*2)/2) : String(Math.round(v));
  const s=ensure(k); s[which]= Number(el.value);
  haptic(8);
}
function toggleSet(k,btn){
  const s=ensure(k);
  if(s.done){ s.done=false; btn.setAttribute('aria-pressed','false'); updateDock(); return; }
  const kg=Number(readField(k,'kg')), reps=Number(readField(k,'reps'));
  if(!kg||!reps){ toast('Wpisz ciężar i powtórzenia'); haptic(30); return; }
  s.kg=kg; s.reps=reps; s.done=true;
  btn.setAttribute('aria-pressed','true');
  haptic(18);

  const best=bestSet(s.ex,s.person);
  if(!best || e1rm(s)>e1rm(best)){
    S.prs[s.ex+s.person]=true;
    toast('★ Rekord: '+ALL_EX[s.ex].n);
    haptic([12,60,12]);
  }
  updateDock();
  openRest(90, ALL_EX[s.ex].n);
}
function updateDock(){
  const total=totalSetsFor(), done=doneCount();
  const b=document.querySelector('.dock-stat b'); if(b) b.textContent=`${done} / ${total} serii`;
  const bar=document.querySelector('.bar i'); if(bar) bar.style.width=(total?done/total*100:0)+'%';
}
function tickClock(){
  clearInterval(window.__ct);
  window.__ct=setInterval(()=>{
    if(!S){clearInterval(window.__ct);return;}
    const el=document.getElementById('clock'); if(!el) return;
    const t=Math.floor((Date.now()-S.start)/1000);
    el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  },1000);
}

/* ---- rest timer ---- */
let restT=null;
function openRest(sec,label){
  let left=sec; const R=46, C=2*Math.PI*R;
  overlay.innerHTML=`
  <div class="scrim" data-rest-close><div class="sheet" onclick="event.stopPropagation()">
    <span class="eyebrow">Przerwa · ${esc(label)}</span>
    <div class="rest-wrap" style="margin-top:14px">
      <div class="ring">
        <svg width="104" height="104"><circle cx="52" cy="52" r="${R}" stroke="var(--iron-600)" stroke-width="7" fill="none"/>
        <circle id="ring-p" cx="52" cy="52" r="${R}" stroke="var(--done)" stroke-width="7" fill="none"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
        <b id="rest-n">${sec}</b>
      </div>
      <div style="flex:1">
        <div class="display" style="font-size:20px">Odpocznij i wróć</div>
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--chalk-dim)">Kolejna seria czeka. Timer zniknie sam.</p>
      </div>
    </div>
    <div class="rest-actions">
      <button data-rest-add="30">+30 S</button>
      <button data-rest-set="120">2:00</button>
      <button data-rest-close>POMIŃ</button>
    </div>
  </div></div>`;
  clearInterval(restT);
  const tick=()=>{
    left--;
    const n=document.getElementById('rest-n'); const c=document.getElementById('ring-p');
    if(!n){clearInterval(restT);return;}
    n.textContent=Math.max(0,left);
    if(c) c.style.strokeDashoffset=String(C*(1-left/sec));
    if(left<=0){ clearInterval(restT); haptic([20,80,20]); closeRest(); }
  };
  restT=setInterval(tick,1000);
  overlay.__rest={get sec(){return sec},add(x){sec+=x;left+=x;},setTo(x){sec=x;left=x;}};
}
function closeRest(){ clearInterval(restT); overlay.innerHTML=''; }

             notes:S.notes, prs:Object.keys(S.prs)};

  window.__last=rec; S=null; clearInterval(window.__ct);

function spark(points, color){
  if(points.length<2) return '<div style="font-size:10px;color:var(--chalk-faint)" class="mono">—</div>';
  const w=64,h=22, mx=Math.max(...points), mn=Math.min(...points), r=(mx-mn)||1;
  const d=points.map((v,i)=>`${i?'L':'M'}${(i/(points.length-1)*w).toFixed(1)},${(h-((v-mn)/r)*h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function viewStats(){
  const p=statsPerson, col=PERSON[p].color;

  const prs=mine.reduce((a,s)=>a+(s.prs?s.prs.filter(k=>k.endsWith(p)).length:0),0);
  const avg=mine.length?Math.round(mine.reduce((a,s)=>a+(s.duration||0),0)/mine.length):0;
  const exIds=[...new Set(Store.sessions().flatMap(s=>s.sets.filter(x=>x.person===p).map(x=>x.ex)))];
  const maxV=Math.max(...mine.map(s=>volume(s.sets,p)),1);

  return `
  <div class="view">
    <div class="masthead">
      <span class="eyebrow">Statystyki</span>
      <h1>Co mówią liczby.</h1>
    </div>
    <div class="lane-switch" data-lane="${p}" role="tablist" aria-label="Osoba">
      <span class="thumb"></span>
      <button role="tab" aria-selected="${p==='martin'}" data-stats-person="martin">MARTIN</button>
      <button role="tab" aria-selected="${p==='ana'}" data-stats-person="ana">ANA</button>
    </div>
    <div class="split2" style="margin-bottom:12px">
      <div class="stat-big"><b>${mine.length}</b><span>treningów</span></div>
      <div class="stat-big"><b>${fmtVol(vol)}</b><span>łączna objętość</span></div>
      <div class="stat-big"><b>${prs}</b><span>rekordów</span></div>
      <div class="stat-big"><b>${fmtDur(avg)}</b><span>średni czas</span></div>
    </div>

    <div class="panel">
      <h3>Objętość sesja po sesji</h3>
      ${mine.length?mine.map(s=>`
        <div class="hbar"><span class="lbl">${fmtDate(s.date)}</span>
        <span class="track"><i style="width:${volume(s.sets,p)/maxV*100}%;background:${col}"></i></span>
        <span class="val">${fmtVol(volume(s.sets,p))}</span></div>`).join(''):'<div class="empty">Brak danych.</div>'}
    </div>

    <div class="panel">
      <h3>Progresja ćwiczeń</h3>
      ${exIds.length?exIds.map(id=>{
        const h=history(id,p); const tops=h.map(x=>x.top);
        const d= tops.length>1 ? (tops[tops.length-1]-tops[0])/tops[0]*100 : 0;
        const cls= d>1?'up':d<-1?'down':'flat';
        return `<div class="prog-row">
          <div class="nm">${esc(ALL_EX[id]?.n||id)}<small>${tops[tops.length-1]} kg top</small></div>
          ${spark(tops,col)}
          <span class="delta ${cls}">${d>0?'+':''}${d.toFixed(0)}%</span>
        </div>`}).join(''):'<div class="empty">Brak danych.</div>'}
    </div>

    <div class="panel">
      <h3>Rekordy (szac. 1RM)</h3>
      ${exIds.map(id=>{const b=bestSet(id,p); if(!b) return '';
        return `<div class="log-row"><span class="log-dot" style="background:${col}"></span>
          <div><div class="t">${esc(ALL_EX[id]?.n||id)}</div><div class="s">${b.kg} kg × ${b.reps}</div></div>
          <div class="v">${e1rm(b).toFixed(1)} kg</div></div>`}).join('')}
    </div>
  </div>`;
}

/* ==========================================================================
   9. Historia
   ========================================================================== */
function viewLog(){
  const all=[...Store.sessions()].reverse();
  return `
  <div class="view">
    <div class="masthead">
      <span class="eyebrow">Historia</span>
      <h1>Wszystkie sesje.</h1>
    </div>
    ${all.length?all.map(s=>`
      <div class="panel">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span class="log-dot" style="background:${s.type==='duo'?'var(--lane-m)':'var(--lane-a)'}"></span>
          <div><div style="font-size:14px;font-weight:600">${s.type==='duo'?'Martin &amp; Ana':'Ana — dół'}</div>
          <div class="s" style="font-size:11px;color:var(--chalk-faint)">${new Date(s.date).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}</div></div>
          <div class="mono" style="margin-left:auto;font-size:12px;color:var(--chalk-dim)">${fmtDur(s.duration||0)}</div>
        </div>
        ${[...new Set(s.sets.map(x=>x.ex))].map(id=>{
          const rel=s.sets.filter(x=>x.ex===id);
          return `<div class="hbar"><span class="lbl">${esc(ALL_EX[id]?.n||id)}</span>
            <span class="track" style="background:none;flex:1;font-family:'Martian Mono',monospace;font-size:10px;color:var(--chalk-faint);height:auto">
            ${rel.map(r=>`${r.kg}×${r.reps}`).join('  ·  ')}</span></div>`}).join('')}
        ${s.seed?'<div class="eyebrow" style="margin-top:8px">dane startowe z notatek</div>':''}
      </div>`).join(''):'<div class="empty"><b>Jeszcze pusto</b>Pierwszy zapisany trening pojawi się tutaj.</div>'}
  </div>`;
}

/* ==========================================================================
   10. Router + zdarzenia
   ========================================================================== */
function tabbar(){
  const t=(r,i,l)=>`<button class="tab" data-nav="${r}" ${route===r?'aria-current="page"':''}><i>${i}</i>${l}</button>`;
  return `<div class="tabbar"><div class="tabbar-inner">
    ${t('home','🏋️','TRENING')}${t('stats','📈','STATY')}${t('log','🗂','HISTORIA')}
  </div></div>`;
}
function render(){
  if(route==='session'){ shell.innerHTML=viewSession(); tickClock(); return; }
  if(route==='summary'){ shell.innerHTML=viewSummary(); return; }
  const body = route==='stats'?viewStats(): route==='log'?viewLog(): viewHome();
  shell.innerHTML=body+tabbar();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-start],[data-nav],[data-act],[data-lane-set],[data-stats-person],[data-check],[data-nudge],[data-collapse],[data-rest-close],[data-rest-add],[data-rest-set]');
  if(!t) return;
  const d=t.dataset;
  if(d.start) return startSession(d.start);
  if(d.nav) return go(d.nav);
  if(d.laneSet){ S.lane=d.laneSet; render(); window.scrollTo(0,0); haptic(10); return; }
  if(d.statsPerson){ statsPerson=d.statsPerson; render(); return; }
  if(d.check) return toggleSet(d.check,t);
  if(d.nudge){ const [k1,k2,k3,which,by]=d.nudge.split('|'); return nudge([k1,k2,k3].join('|'),which,Number(by)); }
  if(d.collapse){ S.collapsed[d.collapse]=!S.collapsed[d.collapse]; render(); return; }
  if(d.restAdd!==undefined){ /* prosty restart z dłuższym czasem */ closeRest(); openRest(30+Number(document.getElementById('rest-n')?.textContent||0)||30,'Przerwa'); return; }
  if(d.restSet!==undefined){ closeRest(); openRest(Number(d.restSet),'Przerwa'); return; }
  if(d.restClose!==undefined) return closeRest();
  if(d.act==='finish') return finishSession();
  if(d.act==='home'){ go('home'); return; }
  if(d.act==='stats'){ go('stats'); return; }
  if(d.act==='abort'){ if(confirm('Przerwać sesję bez zapisu?')){ S=null; clearInterval(window.__ct); go('home'); } return; }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.inp){
    const [ex,person,n,which]=el.dataset.inp.split('|');
    const s=ensure([ex,person,n].join('|'));
    s[which]=Number(el.value.replace(',','.'))||0;
  }
  if(el.dataset.note && S) S.notes[el.dataset.note]=el.value;
});

render();
</script>
</body>
</html>
